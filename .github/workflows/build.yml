name: Pixel 8a A14 GKI 6.1 KernelSU + SUSFS (Official)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================
      # CLEAN
      # ==========================
      - name: Clean
        run: |
          rm -rf *
          df -h

      # ==========================
      # DEPENDENCIES
      # ==========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget unzip zip \
            bc bison flex build-essential \
            libssl-dev libelf-dev python3 rsync

      # ==========================
      # CLONE KERNEL COMMON 6.1
      # ==========================
      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            -b android14-6.1 \
            https://android.googlesource.com/kernel/common \
            kernel

      # ==========================
      # CLONE BUILD SYSTEM (OFFICIAL)
      # ==========================
      - name: Clone Build System
        run: |
          cd kernel
          git clone --depth=1 \
            https://android.googlesource.com/kernel/build

      # ==========================
      # INJECT KERNELSU
      # ==========================
      - name: Inject KernelSU
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      # ==========================
      # ENABLE KSU + SUSFS (GKI WAY)
      # ==========================
      - name: Enable Config
        run: |
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF=y" >> arch/arm64/configs/gki_defconfig

      # ==========================
      # BUILD OFFICIAL GKI
      # ==========================
      - name: Build GKI Official
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh

      # ==========================
      # PACKAGE OUTPUT
      # ==========================
      - name: Zip Output
        run: |
          cd kernel/out/android14-6.1/dist
          zip -r ../../../../Pixel8a-GKI-KSU-SUSFS.zip *

      # ==========================
      # UPLOAD
      # ==========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8a-GKI-KSU-SUSFS
          path: Pixel8a-GKI-KSU-SUSFS.zip
