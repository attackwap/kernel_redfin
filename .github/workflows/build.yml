name: Pixel 8a Auto Patch (Magisk Alpha)

on:
  workflow_dispatch:
    inputs:
      factory_url:
        description: "Direct Factory Image URL"
        required: true

jobs:
  patch:
    runs-on: ubuntu-22.04

    steps:

      # ==========================
      # FREE SPACE
      # ==========================
      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt clean
          df -h

      # ==========================
      # INSTALL TOOLS
      # ==========================
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget unzip zip curl python3 cpio

      # ==========================
      # DOWNLOAD FACTORY IMAGE
      # ==========================
      - name: Download Factory
        run: |
          wget -O factory.zip "${{ github.event.inputs.factory_url }}"

          unzip factory.zip

          # Masuk folder akita-xxxx
          FACTORY_DIR=$(ls -d akita-*)
          cd "$FACTORY_DIR"

          # Ambil nama image zip dengan aman
          IMAGE_ZIP=$(ls image-*.zip)
          echo "Found image zip: $IMAGE_ZIP"

          unzip "$IMAGE_ZIP"

          # Masuk folder hasil unzip (bukan file zip)
          IMAGE_DIR=$(basename "$IMAGE_ZIP" .zip)
          cd "$IMAGE_DIR"

          ls -lh

          mv init_boot.img ../../../init_boot.img

      # ==========================
      # VERIFY INIT_BOOT EXISTS
      # ==========================
      - name: Verify init_boot
        run: |
          ls -lh init_boot.img

      # ==========================
      # DOWNLOAD MAGISK ALPHA
      # ==========================
      - name: Download Magisk Alpha
        run: |
          MAGISK_URL=$(curl -s https://api.github.com/repos/vvb2060/Magisk/releases/latest \
            | grep browser_download_url \
            | grep ".apk" \
            | cut -d '"' -f 4)

          echo "Downloading $MAGISK_URL"
          wget -O magisk.apk "$MAGISK_URL"

          # Extract x86_64 magiskboot for runner
          unzip magisk.apk lib/x86_64/libmagiskboot.so -d magisk
          mv magisk/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      # ==========================
      # PATCH INIT_BOOT
      # ==========================
      - name: Patch init_boot
        run: |
          ./magiskboot unpack init_boot.img
          ./magiskboot repack init_boot.img
          mv new-boot.img magisk_patched.img

      # ==========================
      # VERIFY OUTPUT
      # ==========================
      - name: Verify Patched Image
        run: |
          ls -lh magisk_patched.img

      # ==========================
      # UPLOAD ARTIFACT
      # ==========================
      - name: Upload Patched Image
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8a-MagiskAlpha-Patched
          path: magisk_patched.img
