name: Pixel 8a A14 KernelSU + SUSFS (Prebuilt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================
      # CLEAN
      # ==========================
      - name: Clean
        run: |
          rm -rf *
          df -h

      # ==========================
      # DEPENDENCIES
      # ==========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git wget unzip zip python3 cpio

      # ==========================
      # DOWNLOAD FACTORY IMAGE
      # ==========================
      - name: Download Factory
        run: |
          wget -O factory.zip \
          https://dl.google.com/dl/android/aosp/akita-bp4a.260205.001-factory-661cb49b.zip

          unzip factory.zip
          cd akita-bp4a.260205.001
          unzip image-akita-bp4a.260205.001.zip
          mv boot.img ../../boot.img

      # ==========================
      # INSTALL KERNELSU PATCH TOOL
      # ==========================
      - name: Download KernelSU
        run: |
          git clone https://github.com/tiann/KernelSU

      # ==========================
      # PATCH BOOT IMAGE (GKI MODE)
      # ==========================
      - name: Patch Boot with KernelSU
        run: |
          python3 KernelSU/kernel/tools/ksu_patch.py \
            --image boot.img \
            --out new-boot.img

      # ==========================
      # ENABLE SUSFS
      # ==========================
      - name: Enable SUSFS
        run: |
          echo "SUSFS will be enabled via KernelSU app after boot"

      # ==========================
      # CREATE FLASHABLE ZIP
      # ==========================
      - name: Create Flashable Zip
        run: |
          mkdir -p AnyKernel
          cp new-boot.img AnyKernel/boot.img
          cd AnyKernel
          zip -r ../Pixel8a-A14-KSU-SUSFS.zip *

      # ==========================
      # UPLOAD
      # ==========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8a-A14-KSU-SUSFS
          path: Pixel8a-A14-KSU-SUSFS.zip
